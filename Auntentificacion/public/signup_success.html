<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    padding: 2.5rem 2rem;
    width: 380px;
    text-align: center;
  }
  .card h1 {
    color: #1a1a1a;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .card p {
    color: #666;
    font-size: 15px;
    margin-bottom: 28px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #e03030;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }
  .btn:hover { background: #c02020; }
</style>
</head>
<body>
  <div class="card">
    <h1>Welcome!</h1>
    <p>{{userEmail}}</p>
    <a class="btn" href="/logout">Logout</a>
  </div>
</body>
</html>
