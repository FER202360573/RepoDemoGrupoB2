<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8c8c8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    border: 1.5px solid #f0a0a0;
    padding: 2.5rem 2rem;
    width: 340px;
    text-align: center;
  }
  .card h1 {
    color: #e03030;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .card p {
    color: #444;
    font-size: 15px;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #e03030;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }
  .btn:hover { background: #c02020; }
</style>
</head>
<body>
  <div class="card">
    <h1>Error!</h1>
    <p id="errorMsg">Something went wrong.</p>
    <a class="btn" href="/">Go Back</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = params.get('msg');
    if (msg) document.getElementById('errorMsg').textContent = decodeURIComponent(msg);
  </script>
</body>
</html>
