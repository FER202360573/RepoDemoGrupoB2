<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .container {
    background: #1e1e30;
    border-radius: 16px;
    padding: 2rem;
    width: 340px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 1.5rem;
  }
  .toggle-label {
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
  }
  .switch {
    position: relative;
    width: 48px;
    height: 26px;
  }
  .switch input { display: none; }
  .slider {
    position: absolute;
    inset: 0;
    background: #4a90e2;
    border-radius: 26px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .slider::before {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: transform 0.2s;
  }
  .switch input:checked + .slider::before { transform: translateX(22px); }
  input[type="email"],
  input[type="password"] {
    display: block;
    width: 100%;
    padding: 13px 14px;
    background: #2a2a40;
    border: 1.5px solid #3a3a55;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    margin-bottom: 12px;
    outline: none;
  }
  input:focus { border-color: #4a90e2; }
  input::placeholder { color: #666; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #4a90e2;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s;
  }
  .btn:hover { background: #357bc2; }
</style>
</head>
<body>
  <div class="container">
    <div class="toggle-row">
      <span class="toggle-label">Login</span>
      <label class="switch">
        <input type="checkbox" id="modeToggle" onchange="toggleMode()">
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Sign Up</span>
    </div>

    <form id="authForm" method="POST" action="/login">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="btn" id="actionBtn">Login</button>
    </form>
  </div>

  <script>
    function toggleMode() {
      const isSignup = document.getElementById('modeToggle').checked;
      document.getElementById('authForm').action = isSignup ? '/signup' : '/login';
      document.getElementById('actionBtn').textContent = isSignup ? 'Sign Up' : 'Login';
    }
  </script>
</body>
</html>
